<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0f1738" />
      <stop offset="50%" stop-color="#060814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>

    <!-- Nebula Core Glow -->
    <radialGradient id="nebulaAura" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#060814" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Core Sphere Gradient -->
    <radialGradient id="coreSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="65%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#312e81" />
    </radialGradient>

    <!-- Planet 1 Gradient (Cyan) -->
    <radialGradient id="planetCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0e7490" />
    </radialGradient>

    <!-- Planet 2 Gradient (Pink) -->
    <radialGradient id="planetPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#be185d" />
    </radialGradient>

    <!-- Planet 3 Gradient (Emerald) -->
    <radialGradient id="planetEmerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Void -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Nebula Core Glow -->
  <rect width="1200" height="630" fill="url(#nebulaAura)" />

  <!-- Star Dust Background Flecks -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="120" cy="90" r="1.5" />
    <circle cx="280" cy="180" r="2.2" opacity="0.9" />
    <circle cx="450" cy="80" r="1.2" />
    <circle cx="950" cy="120" r="1.8" />
    <circle cx="1080" cy="220" r="2.0" opacity="0.9" />
    <circle cx="150" cy="480" r="1.5" />
    <circle cx="320" cy="540" r="1.8" />
    <circle cx="880" cy="510" r="1.4" />
    <circle cx="1050" cy="460" r="2.2" opacity="0.8" />
    <circle cx="600" cy="60" r="1.2" />
    <circle cx="720" cy="560" r="1.6" />
  </g>

  <!-- Orbital Rings -->
  <g fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.35">
    <ellipse cx="600" cy="280" rx="280" ry="105" transform="rotate(-15 600 280)" />
    <ellipse cx="600" cy="280" rx="360" ry="135" transform="rotate(22 600 280)" stroke="#c084fc" opacity="0.25" />
    <ellipse cx="600" cy="280" rx="430" ry="160" transform="rotate(-5 600 280)" stroke="#22d3ee" opacity="0.2" />
  </g>

  <!-- Orbiting Planets -->
  <!-- Planet 1: Cyan (TypeScript) -->
  <g transform="translate(370, 210)">
    <circle cx="0" cy="0" r="22" fill="url(#planetCyan)" filter="url(#glow)" />
    <ellipse cx="0" cy="0" rx="32" ry="9" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6" transform="rotate(20)" />
  </g>

  <!-- Planet 2: Pink (Music/Creativity) -->
  <g transform="translate(850, 240)">
    <circle cx="0" cy="0" r="26" fill="url(#planetPink)" filter="url(#glow)" />
    <ellipse cx="0" cy="0" rx="38" ry="11" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6" transform="rotate(-25)" />
  </g>

  <!-- Planet 3: Emerald (System Design) -->
  <g transform="translate(520, 390)">
    <circle cx="0" cy="0" r="18" fill="url(#planetEmerald)" filter="url(#glow)" />
  </g>

  <!-- Central Mastery Core Crystal -->
  <circle cx="600" cy="280" r="64" fill="url(#coreSphere)" filter="url(#glow)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" />
  <circle cx="585" cy="265" r="16" fill="#ffffff" opacity="0.75" filter="blur(2px)" />

  <!-- Top Center Brand Header -->
  <g text-anchor="middle">
    <!-- Lightning Icon & Title -->
    <text x="600" y="80" fill="#818cf8" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="4">⚡ MASTERY</text>
    <text x="600" y="108" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="3">DELIBERATE PRACTICE COSMOS</text>
  </g>

  <!-- Bottom Hero Value Proposition Banner -->
  <g text-anchor="middle">
    <text x="600" y="495" fill="#ffffff" font-size="34" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-0.5">
      Transform Deep Practice into an Expanding 3D Universe
    </text>
    <text x="600" y="535" fill="#a1a1aa" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500">
      Track deliberate focus hours • Unlock celestial milestone rings • Build unstoppable mastery
    </text>
  </g>

  <!-- Bottom Badges Grid -->
  <g transform="translate(360, 565)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="75" y="22" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🪐 3D WebGL Cosmos</text>

    <!-- Badge 2 -->
    <rect x="165" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="240" y="22" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🎧 Ambient Soundscapes</text>

    <!-- Badge 3 -->
    <rect x="330" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="405" y="22" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🔒 100% Private & Local</text>
  </g>
</svg>
